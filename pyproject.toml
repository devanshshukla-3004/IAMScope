[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iamscope"
version = "0.1.0"
description = "Offline-first static risk analysis for AWS IAM policy JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IAMScope Contributors" }]
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27,<1"]

[project.scripts]
iamscope = "iamscope.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["iamscope*"]
